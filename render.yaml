services:
  - type: web
    name: opspilot-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: OpsPilot
      - key: DATABASE_URL
        value: sqlite:///./opspilot.db
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
